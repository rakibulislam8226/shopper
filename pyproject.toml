[project]
name = "shopper"
version = "0.0.0"
description = "Shopper — multi-tenant shop/organization management SaaS (FastAPI backend)"
requires-python = ">=3.13"

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["app", "tests"]
extend-exclude = ["alembic/versions", ".venv", "web"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "F",    # pyflakes
  "I",    # isort
  "UP",   # pyupgrade
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "ASYNC",# flake8-async
  "SIM",  # flake8-simplify
  "RUF",  # ruff-specific
]
ignore = [
  "B008",  # FastAPI uses function calls (Depends()) in argument defaults by design
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true
strict_equality = true
exclude = ["alembic/", "web/", "\\.venv/"]

[[tool.mypy.overrides]]
# Third-party packages without bundled type stubs.
module = ["passlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
